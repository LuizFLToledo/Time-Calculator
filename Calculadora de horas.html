<html>

    <head>

        <meta charset="UTF-8">


        <title> Calculadora de horas </title>

        <style>

            div{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .hora{

                display: inline-block;
                text-align: center;
                justify-content: center;
                align-items: center;
            }

            .resultado, div .p{
                display: inline-block;
                justify-content: center;
                align-items: center;
                text-align: center;
                margin-top: 30px;
                border-top: 2px dashed #ccc;
                padding-top: 200px;
            }

            .operador{
                display: inline-block;
                text-align: center;
                justify-content: center;
            }

            p {
                font-size: 20px;
                font-weight: bold;
                align-items: center;
            }

        </style>

        <script>

            function calcular() {

                var horas1 = document.getElementById("horas1");
                var minutos1 = document.getElementById("minutos1");
                var segundos1 = document.getElementById("segundos1");
                var horas2 = document.getElementById("horas2");
                var minutos2 = document.getElementById("minutos2");
                var segundos2 = document.getElementById("segundos2");

                var totalSegundos1 = (parseInt(horas1.value) * 3600) + (parseInt(minutos1.value) * 60) + parseInt(segundos1.value);
                var totalSegundos2 = (parseInt(horas2.value) * 3600) + (parseInt(minutos2.value) * 60) + parseInt(segundos2.value);

                var operadorSoma = document.getElementById("soma");
                var operadorSubtracao = document.getElementById("subtracao");

                var inputHoras = document.getElementById("horas");
                var inputMinutos = document.getElementById("minutos");
                var inputSegundos = document.getElementById("segundos");
                
                var inputHoras1 = document.getElementById("horas1");
                var inputMinutos1 = document.getElementById("minutos1");    
                var inputSegundos1 = document.getElementById("segundos1");

                var inputHoras2 = document.getElementById("horas2");
                var inputMinutos2 = document.getElementById("minutos2");
                var inputSegundos2 = document.getElementById("segundos2");

                if(inputHoras1.value < 0 || inputMinutos1.value < 0 || inputSegundos1.value < 0 || inputHoras2.value < 0 || inputMinutos2.value < 0 || inputSegundos2.value < 0) {

                    alert("Por favor, insira valores positivos para horas, minutos e segundos.");

                    return;

                }else if(operadorSoma.checked == true){
                
                        var resultadoSegundos = totalSegundos1 + totalSegundos2;

                        var horas = Math.floor(resultadoSegundos / 3600);
                        var resto = resultadoSegundos % 3600;
                        var minutos = Math.floor(resto / 60);
                        var segundos = resto % 60;

                        inputHoras.value = horas;
                        inputMinutos.value = minutos;
                        inputSegundos.value = segundos;

                    } else if(operadorSubtracao.checked == true){

                        var resultadoSegundos = totalSegundos1 - totalSegundos2;
                        var horas = Math.floor(resultadoSegundos / 3600);
                        var resto = resultadoSegundos % 3600;
                        var minutos = Math.floor(resto / 60);
                        var segundos = resto % 60;

                        inputHoras.value = horas;
                        inputMinutos.value = minutos;
                        inputSegundos.value = segundos;

                        var valorHoras = inputHoras.value;
                        var valorMinutos = inputMinutos.value;
                        var valorSegundos = inputSegundos.value;

                        if(valorHoras < 0 || valorMinutos < 0 || valorSegundos < 0) {

                            inputHoras.value = inputHoras.value * -1;
                            inputMinutos.value = inputMinutos.value * -1;
                            inputSegundos.value = inputSegundos.value * -1;

                        }

                    }
                

                }

                function removerZero(){
                    var inputHoras1 = document.getElementById("horas1");
                    var inputMinutos1 = document.getElementById("minutos1");    
                    var inputSegundos1 = document.getElementById("segundos1");

                    var inputHoras2 = document.getElementById("horas2");
                    var inputMinutos2 = document.getElementById("minutos2");
                    var inputSegundos2 = document.getElementById("segundos2");


                    if(inputHoras1.value > 0 || inputMinutos1.value > 0 || inputSegundos1.value > 0 || inputHoras2.value > 0 || inputMinutos2.value > 0 || inputSegundos2.value > 0) {

                        inputHoras1.value = String(inputHoras1.value);
                        inputMinutos1.value = String(inputMinutos1.value);
                        inputSegundos1.value = String(inputSegundos1.value);

                        inputHoras2.value = String(inputHoras2.value);
                        inputMinutos2.value = String(inputMinutos2.value);
                        inputSegundos2.value = String(inputSegundos2.value);

                        if(inputHoras1.value.charAt(0) === "0" && inputHoras1.value.length > 1) {
                            inputHoras1.value = inputHoras1.value.slice(1);
                        }else if(inputMinutos1.value.charAt(0) === "0" && inputMinutos1.value.length > 1) {
                            inputMinutos1.value = inputMinutos1.value.slice(1);
                        }else if(inputSegundos1.value.charAt(0) === "0" && inputSegundos1.value.length > 1) {
                            inputSegundos1.value = inputSegundos1.value.slice(1);
                        }else if(inputHoras2.value.charAt(0) === "0" && inputHoras2.value.length > 1) {
                            inputHoras2.value = inputHoras2.value.slice(1);
                        }else if(inputMinutos2.value.charAt(0) === "0" && inputMinutos2.value.length > 1) {
                            inputMinutos2.value = inputMinutos2.value.slice(1);
                        }else if(inputSegundos2.value.charAt(0) === "0" && inputSegundos2.value.length > 1) {
                            inputSegundos2.value = inputSegundos2.value.slice(1);
                        }
                    }
                }

        </script>

    </head>

    <body>

        <div>

            

                

                <div class="hora">

                    <p> Hora 1 </p>

                    <label for="horas">Horas:</label>
                    <input type="number" name="horas" id="horas1" value="0" onblur="removerZero(this)" required>

                    <label for="minutos">Minutos:</label>
                    <input type="number" name="minutos" id="minutos1" value="0" onblur="removerZero(this)" required>

                    <label for="segundos">Segundos:</label>
                    <input type="number" name="segundos" id="segundos1" value="0" onblur="removerZero(this)" required>
                </div>

                <div class="operador">

                    <p> Operador </p>
                    
                    <input type="radio" name="operador" id="soma" value="soma" checked required>
                    <label for="soma">Soma</label>
                    <input type="radio" name="operador" id="subtracao" value="subtracao" required>
                    <label for="subtracao">Subtração</label>
                </div>

                <div class="hora">

                    <p> Hora 2 </p>

                    <label for="horas">Horas:</label>
                    <input type="number" name="horas" value="0" id="horas2" onblur="removerZero(this)" required>

                    <label for="minutos">Minutos:</label>
                    <input type="number" name="minutos" value="0" id="minutos2" onblur="removerZero(this)" required>

                    <label for="segundos">Segundos:</label>
                    <input type="number" name="segundos" value="0" id="segundos2" onblur="removerZero(this)" required>
                </div>

                

                <div class="resultado">

                    <input type="button" value="Calcular" onclick="calcular()">
                    <input type="button" value="Limpar" onclick="window.location.reload()">
                
                    <p> Resultado: </p>

                    <label for="horas">Horas:</label>
                    <input type="number" name="horas" id="horas" readonly>

                    <label for="minutos">Minutos:</label>
                    <input type="number" name="minutos" id="minutos" readonly>

                    <label for="segundos">Segundos:</label>
                    <input type="number" name="segundos" id="segundos" readonly>


                </div>

        </div>

    </body>

</html>
